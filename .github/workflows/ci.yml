name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # CI installs only the lightweight deps the tests need · skips paddleocr / opencv / vllm (too heavy · not tested in this batch)
          # PyQt6 is a Windows-only UI · not installed in CI · test_overlay_headless.py auto-skips via importorskip
          pip install pydantic httpx pillow numpy pytest fastapi uvicorn websockets
      - name: Run tests
        run: pytest tests/test_schema.py tests/test_frame_monitor.py tests/test_advice_server.py tests/test_overlay_headless.py -v
