name: Deploy Pages

# Deploys the HTML in pitch/ + examples/ to GitHub Pages · manually triggered
# Enable steps:
#   1. repo Settings → Pages → Build and deployment source → "GitHub Actions"
#   2. Actions tab → "Deploy Pages" → "Run workflow"
# Once enabled, URL: https://huannan520.github.io/jcc-replay-analyst/
# For subsequent automatic deploys: just uncomment the push trigger below.

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

# opt-in Node 24 · silences the Node 20 deprecation warning from checkout@v4 / configure-pages@v5 / deploy-pages@v4 / upload-pages-artifact@v3
# GitHub defaults to Node 24 from 2026-06-02 · removes Node 20 on 2026-09-16
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build _site
        run: |
          mkdir -p _site
          # pitch/index.html as the landing · pitch/roadmap.html as the engineering roadmap
          cp pitch/index.html _site/index.html
          cp pitch/roadmap.html _site/roadmap.html
          cp pitch/build_log.html _site/build_log.html
          # Sample HTML replay report
          cp examples/sample_report.html _site/sample_report.html
          # Simple 404 · avoids a crash when a nonexistent path is visited
          cat > _site/404.html <<'HTML'
          <!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
          <title>404 · jcc-replay-analyst</title>
          <style>body{background:#0b0912;color:#e8e5d8;font-family:Songti SC,serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center}
          a{color:#c9a45d;text-decoration:none;border-bottom:1px dotted #8b7244}
          a:hover{color:#e6c17a}</style></head>
          <body><div><h1 style="font-size:64px;font-weight:400;color:#c9a45d">404</h1>
          <p>Page not found · go to <a href="./">home</a> · or the <a href="./roadmap.html">roadmap</a> · or a <a href="./sample_report.html">sample report</a></p></div></body></html>
          HTML

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
